[project]
name = "heattwin"
version = "0.1.0"
description = "Heat Twin: data-center waste heat reuse simulator"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "geopandas>=1.0",
  "shapely>=2.0",
  "osmnx>=2.0",
  "networkx>=3.2",
  "pulp>=2.8",
  "highspy>=1.7",
  "CoolProp>=6.6",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "requests>=2.31",
  "rasterio>=1.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/heattwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
