id: site1_chelsea
name: "111 8th Avenue, Chelsea, Manhattan"
county_fips: "061"
adapter: nyc
kind: urban_commissioned
data_center:
  name: "111 8th Avenue (carrier hotel)"
  lon: -74.0029
  lat: 40.7411
  # IT load is not publicly reported. We DERIVE it from the building's own LL84 2023 disclosure:
  #   505.3 GWh/yr grid electricity (57.7 MW avg) minus an office baseline (Manhattan offices >500k ft2,
  #   LL84 median 37.7 kWh/ft2 x 2.33M ft2 = 10.0 MW; p90 = 16.0 MW) = 41.7-47.6 MW data-center load,
  #   / PUE 1.3-1.7 = 24.5-36.7 MW IT. Recomputed in heattwin.supply; see docs/DECISIONS.md D7.
  it_load_mw: {value: 30, low: 24, high: 37, confidence: medium, source: "Derived from LL84 2023 (BBL 1007390001) electricity minus LL84 office-median baseline, / PUE 1.3-1.7"}
  ll84_bbl: "1007390001"
  existing_cooling: air
study_area:
  # roughly a 1.2 km box around the DC (Chelsea / Meatpacking / West Village edge)
  bbox: [-74.0170, 40.7300, -73.9890, 40.7520]
grid:
  iso: NYISO
  lbmp_zone: N.Y.C.
  lbmp_avg_key: grid.lbmp_avg_2023_zone_j
weather:
  lat: 40.7411
  lon: -74.0029
  year: 2023
screening:
  # Properties whose fuel use is not building heat demand. Kept in outputs with a reason (explainable), never silently dropped.
  max_fossil_intensity_kbtu_ft2: 200   # > ~p99 of candidates: on-site generation or data error
  exclusions:
    - pattern: "(?i)cogen|\\bCHP\\b"
      reason: "Fuel use includes on-site cogeneration (electricity production), not just heat demand"
      source: "Property name in LL84"
    - pattern: "(?i)^Penn South"
      reason: "Runs its own cogeneration plant (100% self-generated electricity since 1986); gas use is not heat demand"
      source: "https://www.pennsouth.coop/penn-south-history.html"
    - pattern: "(?i)^111 Eighth Avenue$"
      reason: "The data center building itself (heat source)"
      source: "LL84 BBL 1007390001"
policy:
  ll97: true
prices:   # assumption keys used to value each fuel a building switches away from, and the heat pump's electricity
  gas: prices.gas_commercial_ny_2023
  oil: prices.oil2_ny_2023
  steam: prices.steam_coned_2023
  propane: prices.propane_ny_2023
  elecheat: prices.electricity_commercial_ny_2023
  hp_electricity: prices.electricity_commercial_ny_2023
network:
  pipe_cost_multiplier_key: null   # the pipes.* table is already priced for Manhattan
