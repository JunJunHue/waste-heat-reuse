# Every number the engine uses lives here. Schema (enforced by heattwin.assumptions + tests):
#   value: number | low/high: optional range used by what-ifs and Monte Carlo
#   unit: string | source: URL or rationale | confidence: high | medium | low
# Entries are added as modules are built; nothing is hardcoded in engine code.

policy:
  ll97_penalty:
    value: 268
    unit: USD/tCO2e
    source: "NYC Local Law 97 of 2019, Admin Code §28-320.6 — https://www.nyc.gov/site/sustainablebuildings/ll97/ll97.page"
    confidence: high
  ll97_ef_natural_gas:
    value: 0.00005311
    unit: tCO2e/kBtu
    source: "LL97 §28-320.3.1.1 emissions coefficients (2024–2029)"
    confidence: high
  ll97_ef_district_steam:
    value: 0.00004493
    unit: tCO2e/kBtu
    source: "LL97 §28-320.3.1.1 emissions coefficients (2024–2029)"
    confidence: high
  ll97_ef_fuel_oil_2:
    value: 0.00007421
    unit: tCO2e/kBtu
    source: "LL97 §28-320.3.1.1 emissions coefficients (2024–2029)"
    confidence: high
  ll97_capture_fraction:
    value: 0.75
    low: 0.3
    high: 1.0
    unit: fraction
    source: "Share of avoided LL97-accounted emissions that actually avoid penalties (i.e. the building is above its 2030 cap). Most large NYC buildings must cut emissions to meet 2030 caps (Urban Green Council LL97 analyses), but not all. Low confidence; ranged in what-ifs. NYCHA follows a separate compliance pathway, so it gets 0."
    confidence: low
  ll97_ef_electricity:
    value: 0.000288962
    unit: tCO2e/kWh
    source: "LL97 §28-320.3.1.1 emissions coefficients (2024–2029)"
    confidence: high

