  oil2_ny_2023:
    value: 30
    low: 22
    high: 38
    unit: USD/MMBtu
    source: "Approximate NY 2023 retail heating oil (~$4.0-4.5/gal per NYSERDA weekly heating-fuel price series), / 0.1385 MMBtu/gal. Not re-verified against a fetched file. Oil is <10% of Site 1 fossil heat."
    confidence: low
  electricity_commercial_ny_2023:
    value: 180.1
    low: 150
    high: 220
    unit: USD/MWh
    source: "EIA Electric Power Annual Table 2.10: NY commercial average retail price 2023 = 18.01 c/kWh (https://www.eia.gov/electricity/annual/html/epa_02_10.html). Hourly price = LBMP_h + (retail_avg - LBMP_avg)"
