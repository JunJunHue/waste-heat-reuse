    unit: tCO2e/kBtu
    source: "LL97 §28-320.3.1.1 emissions coefficients (2024–2029)"
    confidence: high
  ll97_ef_fuel_oil_2:
    value: 0.00007421
    unit: tCO2e/kBtu
    source: "LL97 §28-320.3.1.1 emissions coefficients (2024–2029)"
    confidence: high
  ll97_ef_electricity:
    value: 0.000288962
    unit: tCO2e/kWh
    source: "LL97 §28-320.3.1.1 emissions coefficients (2024–2029)"
    confidence: high

supply:
