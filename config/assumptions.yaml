pipes:
  # Installed cost per trench-metre for a pre-insulated supply+return pair in a dense Manhattan street,
  # including excavation, utility conflicts, restoration and traffic management. Built from the DEA
  # inner-city range (~EUR 1,000-2,500/m by size) x ~3 for Manhattan right-of-way conditions.
  # LOW confidence: the dominant capex uncertainty, so pipe_cost_multiplier_nyc ranges 0.7-1.8 in what-ifs.
  # Capacity is computed in code from inner diameter, network.max_velocity_m_s and the supply/return delta-T.
  dn100: {value: 3500, unit: USD/m, source: "DEA District Heating distribution catalogue (inner city) x Manhattan factor; inner diameter 0.107 m", confidence: low}
  dn150: {value: 4200, unit: USD/m, source: "as dn100; inner diameter 0.160 m", confidence: low}
  dn200: {value: 5000, unit: USD/m, source: "as dn100; inner diameter 0.210 m", confidence: low}
  dn250: {value: 5800, unit: USD/m, source: "as dn100; inner diameter 0.263 m", confidence: low}
  dn300: {value: 6600, unit: USD/m, source: "as dn100; inner diameter 0.313 m", confidence: low}
  dn400: {value: 8200, unit: USD/m, source: "as dn100; inner diameter 0.394 m", confidence: low}
  dn500: {value: 9800, unit: USD/m, source: "as dn100; inner diameter 0.492 m", confidence: low}

continuity:
  # Long-term anchor stability by occupant type: likelihood a customer stays connected for the 25-year asset life.
  # This is a scoring rubric (design choice, docs/DECISIONS.md D10), not measured data.
  public_housing: {value: 1.0, unit: score, source: "Public owner, 24/7 occupancy, no relocation risk", confidence: medium}
  institution: {value: 0.9, unit: score, source: "Hospitals, universities, schools: long-lived institutional owners", confidence: medium}
  multifamily: {value: 0.8, unit: score, source: "24/7 residential occupancy; private ownership can change", confidence: medium}
  hotel: {value: 0.6, unit: score, source: "Occupancy-dependent; frequent ownership change", confidence: medium}
  office: {value: 0.6, unit: score, source: "Daytime load; vacancy risk post-2020", confidence: medium}
  other: {value: 0.5, unit: score, source: "Retail, mixed and unknown types", confidence: low}
